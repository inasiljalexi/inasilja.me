<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Titel, description, keywords, og:, twitter: etc. werden zusätzlich dynamisch via JS aus config.json gesetzt.
         Die statischen Tags hier sind für Link-Vorschauen (WhatsApp, X, Facebook, Telegram …), weil deren Crawler kein JavaScript ausführen.
         Bei Änderungen bitte config.json und diese Tags gleich halten. -->

    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="1200">

    <!-- Reset -->
    <link rel="stylesheet" href="/css/reset.css">

    <!-- Fonts zuerst laden -->
    <link rel="stylesheet" href="/css/fonts.css">

    <!-- Haupt-Styles -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body tabIndex="0">
